---
# 基础环境初始化 role
# 在所有节点上配置 Kubernetes 所需的基础环境

# 1. 关闭 swap
- name: 临时关闭 swap
  command: swapoff -a
  changed_when: false

- name: 永久关闭 swap (注释 /etc/fstab 中的 swap 行)
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s)'
    replace: '# \1'

# 2. 加载内核模块
- name: 加载所需内核模块
  command: "modprobe {{ item }}"
  changed_when: false
  loop: "{{ required_kernel_modules }}"

- name: 持久化内核模块加载配置
  template:
    src: modules-load.conf.j2
    dest: /etc/modules-load.d/k8s.conf
    mode: '0644'

# 3. 设置 sysctl 参数
- name: 持久化 sysctl 配置文件
  template:
    src: sysctl-k8s.conf.j2
    dest: /etc/sysctl.d/k8s.conf
    mode: '0644'

- name: 应用 Kubernetes sysctl 参数
  command: sysctl --system
  changed_when: false

- name: 强制应用 Kubernetes 运行时内核参数
  command: "sysctl -w {{ item.key }}={{ item.value }}"
  loop: "{{ sysctl_k8s_params | dict2items }}"
  changed_when: false

# 4. 停止并禁用 firewalld
- name: 停止并禁用 firewalld (RedHat)
  service:
    name: firewalld
    state: stopped
    enabled: no
  when: (ansible_os_family == "RedHat" or "Kylin" in ansible_distribution)
  failed_when: false

- name: 停止并禁用 ufw (Debian)
  service:
    name: ufw
    state: stopped
    enabled: no
  when: ansible_os_family == "Debian"
  failed_when: false

# 5. 设置 SELinux 为 permissive (仅 RedHat)
- name: 临时设置 SELinux 为 permissive (RedHat)
  command: setenforce 0
  changed_when: false
  failed_when: false
  when: (ansible_os_family == "RedHat" or "Kylin" in ansible_distribution)

- name: 永久设置 SELinux 为 permissive (RedHat)
  replace:
    path: /etc/selinux/config
    regexp: '^SELINUX=.*$'
    replace: 'SELINUX=permissive'
  when: (ansible_os_family == "RedHat" or "Kylin" in ansible_distribution)

# 6. 配置国内镜像源（由后端仓库配置注入 yum_mirrors / apt_mirrors）
# 麒麟不能使用 CentOS 的 $releasever/os/$basearch 路径；先移除旧平台源，
# 后续模板只会渲染 target_os=kylin 的显式适配源。
- name: 移除麒麟上的不兼容平台 yum 镜像源
  file:
    path: /etc/yum.repos.d/platform-mirrors.repo
    state: absent
  when: "'kylin' in (ansible_distribution | lower)"
  register: kylin_platform_mirror_removed

- name: 配置与当前系统匹配的 yum 镜像源
  template:
    src: yum-mirrors.repo.j2
    dest: /etc/yum.repos.d/platform-mirrors.repo
    mode: '0644'
  when:
    - (ansible_os_family == "RedHat" or "Kylin" in ansible_distribution)
    - yum_mirrors | length > 0
  register: yum_mirror_update

- name: 清理 yum 缓存 (RedHat)
  command: yum clean all
  when: (yum_mirror_update.changed | default(false)) or (kylin_platform_mirror_removed.changed | default(false))
  changed_when: false

- name: 检查麒麟原生 yum 仓库可用性
  command: yum repolist --enabled
  changed_when: false
  when: "'kylin' in (ansible_distribution | lower)"

- name: 配置国内 apt 镜像源 (Debian)
  template:
    src: apt-mirrors.sources.j2
    dest: /etc/apt/sources.list.d/platform-mirrors.list
    mode: '0644'
  when:
    - ansible_os_family == "Debian"
    - apt_mirrors | length > 0
  register: apt_mirror_update

- name: 清理 apt 缓存 (Debian)
  command: apt-get clean
  when: apt_mirror_update.changed | default(false)
  changed_when: false

# 7. 安装基础依赖包
- name: 安装基础依赖包 (RedHat)
  yum:
    name: "{{ base_packages_redhat }}"
    state: present
  when: (ansible_os_family == "RedHat" or "Kylin" in ansible_distribution)

- name: 安装基础依赖包 (Debian)
  apt:
    name: "{{ base_packages_debian }}"
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

# 7. 配置时间同步
- name: 安装 chrony (RedHat)
  yum:
    name: chrony
    state: present
  when: (ansible_os_family == "RedHat" or "Kylin" in ansible_distribution)

- name: 安装 chrony (Debian)
  apt:
    name: chrony
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: 启动并设置 chrony 开机自启 (RedHat)
  service:
    name: chronyd
    state: started
    enabled: yes
  when: (ansible_os_family == "RedHat" or "Kylin" in ansible_distribution)

- name: 启动并设置 chrony 开机自启 (Debian)
  service:
    name: chrony
    state: started
    enabled: yes
  when: ansible_os_family == "Debian"

# 8. 确保 hostname 正确设置
- name: 检查当前 hostname
  command: hostname
  register: current_hostname
  changed_when: false

- name: 设置 hostname (仅在不符合时修改)
  hostname:
    name: "{{ inventory_hostname }}"
  when: current_hostname.stdout != inventory_hostname

- name: 写入节点 hostname 本地解析
  lineinfile:
    path: /etc/hosts
    regexp: "^{{ ansible_host | regex_escape }}\\s+{{ inventory_hostname | regex_escape }}$"
    line: "{{ ansible_host }} {{ inventory_hostname }}"
    state: present

# 配置 Kubernetes 仓库
- name: 配置 Kubernetes yum 仓库 (RedHat)
  template:
    src: kubernetes.repo.j2
    dest: /etc/yum.repos.d/kubernetes.repo
    mode: '0644'
  when: (ansible_os_family == "RedHat" or "Kylin" in ansible_distribution)
