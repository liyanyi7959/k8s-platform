---
# 初始化 Master 节点

# 1. 添加 Kubernetes yum/apt 仓库
- name: 添加 Kubernetes 仓库 (RedHat 系列)
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes
    baseurl: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor_version }}/rpm/"
    enabled: true
    gpgcheck: true
    repo_gpgcheck: true
    gpgkey: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor_version }}/rpm/repodata/repomd.xml.key"
  when: ansible_os_family == "RedHat"

- name: 创建 apt keyrings 目录 (Debian 系列)
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: ansible_os_family == "Debian"

- name: 下载 Kubernetes 仓库签名密钥 (Debian 系列)
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: "0644"
  when: ansible_os_family == "Debian"

- name: 添加 Kubernetes 仓库 (Debian 系列)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor_version }}/deb/ /"
    state: present
    filename: kubernetes
  when: ansible_os_family == "Debian"

# 2. 安装 kubeadm, kubelet, kubectl
- name: 安装 kubeadm/kubelet/kubectl (RedHat 系列)
  ansible.builtin.yum:
    name:
      - "kubeadm-{{ k8s_package_version }}"
      - "kubelet-{{ k8s_package_version }}"
      - "kubectl-{{ k8s_package_version }}"
    state: present
    disable_excludes: kubernetes
  when: ansible_os_family == "RedHat"

- name: 安装 kubeadm/kubelet/kubectl (Debian 系列)
  ansible.builtin.apt:
    name:
      - "kubeadm={{ k8s_package_version }}-1.1"
      - "kubelet={{ k8s_package_version }}-1.1"
      - "kubectl={{ k8s_package_version }}-1.1"
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: 锁定 kubeadm/kubelet/kubectl 版本 (RedHat 系列)
  ansible.builtin.command: yum versionlock add kubeadm kubelet kubectl
  changed_when: false
  when: ansible_os_family == "RedHat"

- name: 锁定 kubeadm/kubelet/kubectl 版本 (Debian 系列)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubeadm
    - kubelet
    - kubectl
  when: ansible_os_family == "Debian"

# 3. 启用并启动 kubelet
- name: 启用并启动 kubelet
  ansible.builtin.systemd:
    name: kubelet
    state: started
    enabled: true
    daemon_reload: true

# 4. 生成 kubeadm 初始化配置文件
- name: 生成 kubeadm 初始化配置文件
  ansible.builtin.template:
    src: kubeadm-init.yaml.j2
    dest: /tmp/kubeadm-init.yaml
    mode: "0644"

# 5. 执行 kubeadm init
- name: 执行 kubeadm init
  ansible.builtin.command: "kubeadm init --config /tmp/kubeadm-init.yaml {{ kubeadm_init_extra_args }}"
  args:
    creates: /etc/kubernetes/admin.conf

# 6. 创建 kubeconfig 目录并复制 admin.conf
- name: 创建 kubeconfig 目录
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.kube"
    state: directory
    mode: "0755"

- name: 复制 admin.conf 到 kubeconfig 目录
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ ansible_env.HOME }}/.kube/config"
    remote_src: true
    mode: "0600"
    owner: "{{ ansible_env.USER | default(ansible_user_id) }}"

# 7. 生成 join command
- name: 生成 join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command_result
  changed_when: false

# 8. 将 join command 设置为 fact
- name: 设置 join_command fact
  ansible.builtin.set_fact:
    join_command: "{{ join_command_result.stdout }}"

# 9. 输出初始化结果
- name: 输出初始化结果
  ansible.builtin.debug:
    msg: "Kubernetes Master 初始化完成。Join command: {{ join_command }}"
