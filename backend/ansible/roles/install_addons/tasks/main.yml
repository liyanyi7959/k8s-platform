---
- name: 安装 metrics-server
  ansible.builtin.command: >-
    kubectl apply -f
    https://github.com/kubernetes-sigs/metrics-server/releases/download/{{ metrics_server_version }}/components.yaml
  register: metrics_server_apply
  changed_when: "'created' in metrics_server_apply.stdout or 'configured' in metrics_server_apply.stdout"
  when: "'metrics-server' in addons"

- name: 配置 metrics-server 兼容自签名 kubelet 证书
  ansible.builtin.shell: |
    set -o pipefail
    if ! kubectl -n kube-system get deployment metrics-server -o jsonpath='{.spec.template.spec.containers[0].args}' | grep -q -- '--kubelet-insecure-tls'; then
      kubectl -n kube-system patch deployment metrics-server --type=json -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
    fi
  args:
    executable: /bin/bash
  register: metrics_server_patch
  changed_when: "'patched' in metrics_server_patch.stdout"
  when: "'metrics-server' in addons"

- name: 等待 metrics-server 就绪
  ansible.builtin.command: kubectl rollout status deployment/metrics-server -n kube-system --timeout=300s
  changed_when: false
  when: "'metrics-server' in addons"

- name: 安装 ingress-nginx
  ansible.builtin.command: >-
    kubectl apply -f
    https://raw.githubusercontent.com/kubernetes/ingress-nginx/{{ ingress_nginx_version }}/deploy/static/provider/cloud/deploy.yaml
  register: ingress_nginx_apply
  changed_when: "'created' in ingress_nginx_apply.stdout or 'configured' in ingress_nginx_apply.stdout"
  when: "'ingress-nginx' in addons"

- name: 等待 ingress-nginx 就绪
  ansible.builtin.command: kubectl rollout status deployment/ingress-nginx-controller -n ingress-nginx --timeout=300s
  changed_when: false
  when: "'ingress-nginx' in addons"

- name: 安装 local-path-provisioner
  ansible.builtin.command: >-
    kubectl apply -f
    https://raw.githubusercontent.com/rancher/local-path-provisioner/{{ local_path_provisioner_version }}/deploy/local-path-storage.yaml
  register: local_path_apply
  changed_when: "'created' in local_path_apply.stdout or 'configured' in local_path_apply.stdout"
  when: "'local-storage' in addons"

- name: 等待 local-path-provisioner 就绪
  ansible.builtin.command: kubectl rollout status deployment/local-path-provisioner -n local-path-storage --timeout=300s
  changed_when: false
  when: "'local-storage' in addons"
