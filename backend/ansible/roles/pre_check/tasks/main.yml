---
# 环境预检 role
# 在部署前验证所有节点满足 Kubernetes 最低要求

# 1. 确认主机连通性
- name: 检查主机连通性 (ping)
  ping:

# 2. 检查 OS 发行版
- name: 收集 OS 发行版信息
  setup:
    gather_subset:
      - os_family
      - distribution
      - hardware

- name: 显示 OS 发行版信息
  debug:
    msg: "OS: {{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_os_family }})"

- name: 验证受支持的 OS 家族
  fail:
    msg: "不支持的 OS 家族: {{ ansible_os_family }}，仅支持 RedHat、Kylin 和 Debian"
  when:
    - ansible_os_family not in ['RedHat', 'Debian']
    - "'Kylin' not in ansible_distribution"

# 3. 检查 CPU 核数
- name: 检查 CPU 核数
  fail:
    msg: "CPU 核数不足: {{ ansible_processor_vcpus }} 核，要求至少 {{ min_cpu_cores }} 核"
  when: ansible_processor_vcpus < min_cpu_cores

# 4. 检查内存
- name: 检查内存容量
  fail:
    msg: "内存不足: {{ ansible_memtotal_mb }}MB，要求至少 {{ min_memory_mb }}MB"
  when: ansible_memtotal_mb < min_memory_mb

# 5. 检查磁盘可用空间
- name: 检查根分区磁盘可用空间
  fail:
    msg: "磁盘空间不足: {{ (item.size_available / 1024 / 1024 / 1024) | round(1) }}GB 可用，要求至少 {{ min_disk_gb }}GB"
  when:
    - item.mount == '/'
    - (item.size_available / 1024 / 1024 / 1024) < min_disk_gb
    - inventory_hostname not in preflight_ignored_disk_hosts
  loop: "{{ ansible_mounts }}"

- name: 提示已人工放行磁盘容量检查
  debug:
    msg: "该节点的 20GB 磁盘建议值已由操作人员确认并放行"
  when: inventory_hostname in preflight_ignored_disk_hosts

# 6. 检查 swap 是否关闭 (非关键检查，仅输出警告)
- name: 检查 swap 状态
  command: swapon --show
  register: swap_status
  changed_when: false

- name: 输出 swap 状态警告
  debug:
    msg: "警告: swap 未关闭，将在 bootstrap 阶段处理"
  when: swap_status.stdout | length > 0

# 7. master 节点检查关键端口未被占用；已初始化节点允许幂等重试
- name: 检查 master 节点关键端口是否被占用
  block:
    - name: 检查控制平面是否已经初始化
      stat:
        path: /etc/kubernetes/admin.conf
      register: master_admin_conf

    - name: 收集 master 关键端口占用情况
      command: "ss -tlnp"
      register: master_port_status
      changed_when: false

    - name: 验证 master 关键端口未被占用
      fail:
        msg: "端口 {{ item }} 已被占用，请释放该端口后再执行部署"
      loop: "{{ master_required_ports }}"
      when:
        - not master_admin_conf.stat.exists
        - master_port_status.stdout | regex_search(':' + item | string + '\\b')
  when: "'master' in group_names"

# 8. 输出预检结果摘要
- name: 输出预检结果摘要
  debug:
    msg:
      - "========== 预检结果摘要 =========="
      - "主机: {{ ansible_hostname }}"
      - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_os_family }})"
      - "CPU 核数: {{ ansible_processor_vcpus }}"
      - "内存: {{ ansible_memtotal_mb }}MB"
      - "Swap: {{ '已关闭' if swap_status.stdout | length == 0 else '未关闭(将在bootstrap处理)' }}"
      - "节点角色: {{ 'master' if 'master' in group_names else 'worker' }}"
      - "预检通过!"
