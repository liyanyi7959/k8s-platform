---
# 安装网络插件 (在 master 节点执行)

# ============================================
# Flannel
# ============================================
- name: 下载 Flannel YAML 文件
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/flannel-io/flannel/{{ flannel_version }}/Documentation/kube-flannel.yml"
    dest: /tmp/kube-flannel.yml
    mode: "0644"
  when: cni_type == "flannel"

- name: 替换 Flannel pod 网段
  ansible.builtin.replace:
    path: /tmp/kube-flannel.yml
    regexp: '10\.244\.0\.0/16'
    replace: "{{ pod_cidr }}"
  when: cni_type == "flannel"

- name: 安装 Flannel CNI
  ansible.builtin.command: kubectl apply -f /tmp/kube-flannel.yml
  args:
    creates: /tmp/.cni_flannel_installed
  changed_when: true
  when: cni_type == "flannel"

- name: 标记 Flannel 已安装
  ansible.builtin.file:
    path: /tmp/.cni_flannel_installed
    state: touch
    mode: "0644"
  when: cni_type == "flannel"

# ============================================
# Calico
# ============================================
- name: 下载 Calico YAML 文件
  ansible.builtin.get_url:
    url: "https://docs.projectcalico.org/manifests/calico.yaml"
    dest: /tmp/calico.yaml
    mode: "0644"
  when: cni_type == "calico"

- name: 替换 Calico pod 网段 (CALICO_IPV4POOL_CIDR)
  ansible.builtin.replace:
    path: /tmp/calico.yaml
    regexp: '192\.168\.0\.0/16'
    replace: "{{ pod_cidr }}"
  when: cni_type == "calico"

- name: 安装 Calico CNI
  ansible.builtin.command: kubectl apply -f /tmp/calico.yaml
  args:
    creates: /tmp/.cni_calico_installed
  changed_when: true
  when: cni_type == "calico"

- name: 标记 Calico 已安装
  ansible.builtin.file:
    path: /tmp/.cni_calico_installed
    state: touch
    mode: "0644"
  when: cni_type == "calico"

# ============================================
# Cilium
# ============================================
- name: 下载 Cilium YAML 文件
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/cilium/cilium/{{ cilium_version }}/install/kubernetes/quick-install.yaml"
    dest: /tmp/cilium-quick-install.yaml
    mode: "0644"
  when: cni_type == "cilium"

- name: 替换 Cilium pod 网段
  ansible.builtin.replace:
    path: /tmp/cilium-quick-install.yaml
    regexp: '10\.0\.0\.0/8'
    replace: "{{ pod_cidr }}"
  when: cni_type == "cilium"

- name: 安装 Cilium CNI
  ansible.builtin.command: kubectl apply -f /tmp/cilium-quick-install.yaml
  args:
    creates: /tmp/.cni_cilium_installed
  changed_when: true
  when: cni_type == "cilium"

- name: 标记 Cilium 已安装
  ansible.builtin.file:
    path: /tmp/.cni_cilium_installed
    state: touch
    mode: "0644"
  when: cni_type == "cilium"

# ============================================
# 等待 CNI pods 就绪
# ============================================
- name: 等待 CNI pods 就绪
  ansible.builtin.command: kubectl wait --for=condition=Ready pods -A -l app={{ cni_type }} --timeout=300s
  register: cni_ready
  changed_when: false
  failed_when: false

# ============================================
# 检查节点状态
# ============================================
- name: 检查节点状态是否 Ready
  ansible.builtin.command: kubectl get nodes
  register: node_status
  changed_when: false

- name: 输出节点状态
  ansible.builtin.debug:
    msg: "{{ node_status.stdout_lines }}"
