---
# 注册集群到平台

# 0. 在交付 kubeconfig 前验证集群已经可用
- name: 等待所有 Kubernetes 节点 Ready
  command: kubectl wait --for=condition=Ready nodes --all --timeout=300s
  changed_when: false

# kubeconfig 由后端通过 SSH 从 Master 读取，避免依赖控制器操作系统。
- name: 输出注册信息
  debug:
    msg:
      - "集群注册信息已准备完成"
      - "Master IP: {{ master_ip }}"
      - "API Server Port: {{ k8s_api_server_port }}"
      - "Kubeconfig 将由后端通过 SSH 安全回收"
