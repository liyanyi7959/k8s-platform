---
# K8s Platform 集群部署主 Playbook
# 按顺序执行各 role 完成集群初始化
#
# 支持按步骤重试：当 extra vars 中传入 retry_enabled_steps（步骤 key 列表）时，
# 只执行列表中的 role；未传入时执行全部 role，保持原有行为。

- name: 环境预检 - 所有节点
  hosts: all
  become: yes
  any_errors_fatal: true
  roles:
    - role: pre_check
      when: retry_enabled_steps is not defined or 'pre_check' in retry_enabled_steps

- name: 基础环境初始化 - 所有节点
  hosts: all
  become: yes
  any_errors_fatal: true
  roles:
    - role: bootstrap
      when: retry_enabled_steps is not defined or 'bootstrap' in retry_enabled_steps

- name: 容器运行时安装 - 所有节点
  hosts: all
  become: yes
  any_errors_fatal: true
  roles:
    - role: container_runtime
      when: retry_enabled_steps is not defined or 'container_runtime' in retry_enabled_steps

- name: Kubernetes Master 初始化
  hosts: master
  become: yes
  any_errors_fatal: true
  roles:
    - role: kubeadm_init
      when: retry_enabled_steps is not defined or 'kubeadm_init' in retry_enabled_steps

- name: Worker 节点加入集群
  hosts: worker
  become: yes
  any_errors_fatal: true
  roles:
    - role: join_workers
      when: retry_enabled_steps is not defined or 'join_workers' in retry_enabled_steps

- name: 安装 CNI 网络插件
  hosts: master
  become: yes
  any_errors_fatal: true
  roles:
    - role: install_cni
      when: retry_enabled_steps is not defined or 'install_cni' in retry_enabled_steps

- name: 安装 Helm
  hosts: master
  become: yes
  any_errors_fatal: true
  roles:
    - role: install_helm
      when: retry_enabled_steps is not defined or 'install_helm' in retry_enabled_steps

- name: 安装 Kubernetes 扩展组件
  hosts: master
  become: yes
  any_errors_fatal: true
  roles:
    - role: install_addons
      when: retry_enabled_steps is not defined or 'install_addons' in retry_enabled_steps

- name: 节点注册到管理平台
  hosts: master
  become: yes
  any_errors_fatal: true
  roles:
    - role: register
      when: retry_enabled_steps is not defined or 'register' in retry_enabled_steps
