---
# K8s Platform 全局默认变量

# Kubernetes 版本
k8s_version: "v1.31.0"
k8s_package_version: "1.31.0"
k8s_minor_version: "1.31"

# 网络 CIDR
pod_cidr: "10.244.0.0/16"
svc_cidr: "10.96.0.0/12"

# CNI 配置
cni_type: "flannel"

# 容器运行时
container_runtime: "containerd"

# API Server
k8s_api_server_port: 6443

# Kubernetes 控制面镜像源（国内网络默认使用阿里云镜像）
k8s_image_repository: "registry.aliyuncs.com/google_containers"

# kubeadm init 额外参数
kubeadm_init_extra_args: ""

# 可选扩展组件
addons: []

# 由后端为每次任务注入唯一的临时输出路径
preflight_ignored_disk_hosts: []

# Docker CE 仓库（国内默认使用阿里云镜像，避免 download.docker.com 不可达）
docker_yum_baseurl: "https://mirrors.aliyun.com/docker-ce/linux/centos/{{ ansible_distribution_major_version }}/$basearch/stable"
docker_yum_gpgkey: "https://mirrors.aliyun.com/docker-ce/linux/centos/gpg"

# Kubernetes yum 仓库（默认使用官方 pkgs.k8s.io，可被后端仓库配置覆盖）
k8s_yum_baseurl: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor_version }}/rpm/"
k8s_yum_gpgkey: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor_version }}/rpm/repodata/repomd.xml.key"

# 基础 yum/apt 镜像源（由后端仓库配置注入，为空时不替换）
yum_mirrors: []
apt_mirrors: []
