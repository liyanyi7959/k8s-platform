# ============================================================
# 星枢 K8S 管理平台 - 单机 docker-compose 部署
#
# 组成：mysql（必选）+ redis（缓存/会话）+ app（后端单体）
#
# 使用步骤：
#   1. cp .env.example .env
#   2. 编辑 .env，修改全部密钥/密码（生产必须）
#   3. docker compose up -d --build
#   4. 验证：curl http://127.0.0.1:8080/healthz
#
# 说明：
#   - 后端为模块化单体，全部功能编译进一个进程，无需 API Gateway。
#   - mysql/redis 的 3306/6379 端口仅建议在调试期映射，生产请注释掉，
#     后端通过 compose 内部网络（mysql:3306 / redis:6379）访问。
# ============================================================
name: k8s-platform

services:
  # ---------- MySQL（必选，业务数据与元数据）----------
  mysql:
    image: mysql:8.0
    container_name: k8s-platform-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    # ports:
    #   - "3306:3306"          # 生产环境请注释，避免数据库端口直接暴露
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ---------- Redis（推荐启用：会话/验证码/缓存）----------
  redis:
    image: redis:7-alpine
    container_name: k8s-platform-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    # ports:
    #   - "6379:6379"          # 生产环境请注释
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------- 后端服务（模块化单体）----------
  app:
    build:
      context: ../..          # 构建上下文为项目根目录（含 backend/）
      dockerfile: docker/Dockerfile
    image: k8s-platform-backend:latest
    container_name: k8s-platform-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # ---- 服务 ----
      ADDR: ":8080"
      GIN_MODE: "release"
      # ---- 数据库（容器内通过 compose 网络访问 mysql 服务名）----
      MYSQL_DSN: "root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=True&loc=Local"
      AUTO_MIGRATE: "true"                 # 单实例部署可开启自动迁移
      # ---- 鉴权与加密 ----
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: "168h"
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CRYPTO_MASTER_KEY: ${CRYPTO_MASTER_KEY}
      # ---- Redis（会话/验证码/缓存）----
      REDIS_ENABLED: "true"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: "0"
      REDIS_DEFAULT_TTL: "20s"
      # ---- 日志 ----
      LOG_LEVEL: "info"
      LOG_FORMAT: "json"
      # ---- AI（可选，默认关闭；启用需配置 provider）----
      AI_ENABLED: "false"
      # AI_DEFAULT_PROVIDER: "openai"
      # AI_DEFAULT_CHAT_MODEL: "gpt-4o-mini"
      # AI_DEFAULT_VISION_MODEL: "gpt-4o-mini"
      AI_UPLOAD_DIR: "data/ai-uploads"
      # ---- 邮件（可选，找回密码用）----
      MAIL_ENABLED: "false"
      # MAIL_HOST: "smtp.qq.com"
      # MAIL_PORT: "587"
      # MAIL_USERNAME: "you@example.com"
      # MAIL_PASSWORD: "smtp-auth-code"
      # MAIL_FROM: "you@example.com"
      # MAIL_STARTTLS: "true"
      # MAIL_SSL: "false"
    volumes:
      # AI 上传等运行时数据持久化（镜像内 /app/data 属主为 uid 10001，
      # 使用命名卷会自动继承镜像中的目录属主，非 root 可写）
      - app-data:/app/data
    ports:
      - "8080:8080"            # 对外 API 端口
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  mysql-data:
  redis-data:
  app-data:
