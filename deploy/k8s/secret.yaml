# ============================================================
# 星枢 K8S 管理平台 - 敏感配置（Secret）
#
# 使用 stringData 便于阅读；apply 后 K8s 会以 base64 存储。
# 生产环境建议改用命令行创建，避免密钥明文写入文件：
#   kubectl create secret generic app-secrets -n k8s-platform \
#     --from-literal=MYSQL_ROOT_PASSWORD='...' \
#     --from-literal=JWT_SECRET='...' \
#     --from-literal=CRYPTO_MASTER_KEY='...' \
#     --from-literal=REDIS_PASSWORD='...' \
#     --from-literal=ADMIN_PASSWORD='...'
#
# 密钥生成（32 字节随机串）：
#   Linux/macOS : openssl rand -hex 32
#   Windows     : [System.Convert]::ToHexString([System.Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: k8s-platform
type: Opaque
stringData:
  # MySQL root 密码（与 MYSQL_DSN 一致）
  MYSQL_ROOT_PASSWORD: "ChangeMe_Root_123456"
  # JWT 签名密钥（>=32 字节）
  JWT_SECRET: "ChangeMe_JWT_Secret_32bytes_min_length"
  # 敏感数据加密主密钥（AES-256-GCM，>=32 字节；不配置则回退使用 JWT_SECRET）
  CRYPTO_MASTER_KEY: "ChangeMe_Crypto_Master_Key_32bytes"
  # Redis 密码
  REDIS_PASSWORD: "ChangeMe_Redis_123456"
  # 内置管理员密码（首次启动自动创建管理员）
  ADMIN_PASSWORD: "ChangeMe_Admin@123456"
